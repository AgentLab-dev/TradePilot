[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tradepilot"
version = "0.1.0"
description = "An autonomous AI agent that monitors markets, plans trades, and reports risk."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tradepilot = "tradepilot.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
