<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>TradePilot Desk</title>
  <meta name="description" content="Live flags · latest book. TradePilot desk table from TradePilot-26Q3."/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --sky: #7dd3fc;
      --teal: #0d9488;
      --ink: #1e3a4c;
      --muted: #4b6b7a;
      --paper: #ffffff;
      --wash: #eef9ff;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--paper);
      color: var(--ink);
      font-family: Nunito, "Trebuchet MS", "Segoe UI", sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      flex: 0 0 auto;
      display: flex;
      align-items: baseline;
      gap: 14px;
      flex-wrap: wrap;
      padding: 10px 18px 8px;
      background: linear-gradient(180deg, var(--wash) 0%, var(--paper) 100%);
      border-bottom: 3px solid var(--sky);
    }
    h1 {
      margin: 0;
      font-size: clamp(1.6rem, 3vw, 2.15rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--teal);
      line-height: 1.1;
    }
    .sub {
      margin: 0;
      font-size: clamp(1rem, 2vw, 1.2rem);
      font-weight: 600;
      color: var(--muted);
    }
    .sheet {
      flex: 1 1 auto;
      min-height: 0;
      background: var(--paper);
    }
    iframe {
      display: block;
      width: 100%;
      height: 100%;
      min-height: calc(100vh - 92px);
      border: 0;
      background: var(--paper);
    }
    footer {
      flex: 0 0 auto;
      padding: 6px 18px 8px;
      font-size: 0.85rem;
      color: var(--muted);
      background: var(--paper);
    }
    footer a {
      color: var(--teal);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <header>
    <h1>TradePilot Desk</h1>
    <p class="sub">Live flags · latest book</p>
  </header>
  <div class="sheet">
    <iframe
      title="TradePilot desk — FULLCHECK_2026-09-03"
      src="https://docs.google.com/spreadsheets/d/e/2PACX-1vQWnq16Jzrj91DqM1xlEukdqCpmI_3XnywQaQZ-l-tRN1-20pIsV38l3W7znjcOsSHuLJZyPzgFa7a-/pubhtml?gid=2024844456&amp;single=true&amp;widget=true"
      referrerpolicy="no-referrer-when-downgrade"
    ></iframe>
  </div>
  <footer>
    Data from TradePilot-26Q3 · refresh the page for latest ·

  </footer>
</body>
</html>
